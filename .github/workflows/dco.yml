# Checks that every commit in a pull request carries a "Signed-off-by:" line (the Developer Certificate of
# Origin, see CONTRIBUTING.md). It needs no GitHub App, so it works in any repository or fork.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+@.+>[[:space:]]*$'; then
              echo "::error::Commit $sha has no Signed-off-by line: $(git show -s --format=%s "$sha")"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Add the line with: git commit -s --amend (one commit) or git rebase --signoff $BASE (several)."
            echo "See 'Signing off your work' in CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits are signed off."
